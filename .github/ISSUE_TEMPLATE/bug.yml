name: 缺陷
description: 提供可复现行为与验收结果
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 提交版本、环境和需求编号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期与实际行为
      description: 使用合成输入；不要粘贴真实私人记录或凭证。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 影响范围与已脱敏的证据
